[global/wm]
margin-top = 0
margin-bottom = 0

include-file = ~/.config/polybar/sch/colors.ini
include-file = ~/.config/polybar/sch/modules.ini

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false

override-redirect = false

bottom = false

fixed-center = true

; Pixel or percentage values
width = 100%
height = 43

offset-x = 0
offset-y = 0

background = ${color.background}
foreground = ${color.foreground}

radius-top = 0
radius-bottom = 0

overline-size = 7
overline-color = ${color.background}
underline-size = 7
underline-color = ${color.background}

border-size = 0
border-color = ${color.background}

padding = 0
padding-left = 1

module-margin-left = 0
module-margin-right = 0

; <font-name>;<vertical-offset>

; Text Fonts
font-0 = RobotoMono Nerd Font:style=Regular:size=11;2
; Icon Fonts
font-1 = Font Awesome 6 Free Regular:style=Regular:size=13;2
font-2 = Font Awesome 6 Free Solid:style=Solid:size=10;2
font-3 = Font Awesome 6 Brands Regular:style=Regular:size=10;2
; Other
font-4 = RobotoMono Nerd Font:style=Regular:size=18;4
font-5 = RobotoMono Nerd Font:style=Regular:size=6;3

font-6 = "Iosevka Nerd Font:pixelsize=14;2"
font-7 = "Iosevka Nerd Font:style=Medium:size=22;5"


; -------------------------------------------

modules-left = sep-1 battery sep-2 sep-3 sep-1 cpu memory filesystem sep-2 sep-3 sep-1 network sep-2 sep-3 sep-1 updates sep-2 sep-3
modules-center = sep-1 workspaces sep-2 sep-3 sep-1 title sep-2 sep-3 
modules-right = sep-1 pulseaudio sep-2 sep-3 sep-1 dnd sep-2 sep-3 sep-1 playerctl sep-2 sep-3 sep-1 bluetooth sep-2 sep-3 sep-1 arrow sep-2 sep-3 sep-1 date sep-2 sep-3 sep-1 sysmenu sep-2 sep-3
enable-ipc = true

; tray-position = center
; tray-padding = 4
; tray-background = ${color.background}
; tray-offset-x = 500
; -------------------------------------------

separator =
dim-value = 1.0
wm-name =
locale =

click-left =
click-middle =
click-right =
scroll-up =
scroll-down =
double-click-left =
double-click-middle =
double-click-right =

cursor-click = pointer
cursor-scroll =


; [bar/tray]

; monitor-strict = false
; width = 20
; height = 25
; offset-x = 85% ######### offset values only dtermine the position of bar in the screen set it accordingly to your need
; offset-y = 35   

; override-redirect = true  ############### to make offset vales to work override-direct value must be true
; fixed-center = true
; background = ${color.background-alt}
; ; background = ${colors.background}
; ;foreground = ${colors.foreground}

; radius = 8
; line-size = 0
; line-color = #f00

; padding-left = 0
; padding-right = 1
; module-margin-left = 0
; module-margin-right = 0

; modules-right =  sep-3

; tray-position = right
; tray-detached = false
; tray-offset-x = 0
; tray-offset-y = 0
; tray-padding = 1
; tray-maxsize = 20
; tray-scale = 1.0
; tray-background = ${colors.background}

[bar/tray]
monitor-strict = false
width = 130        ; adjust so it matches arrow module width + tray icons
height = 20
offset-x = 79%     ; tweak until it aligns perfectly under arrow module
offset-y = 40      ; exactly main bar height so it sits below

override-redirect = true
fixed-center = true

background = ${color.background}
foreground = ${color.foreground}

radius-top = 0
radius-bottom = 12   ; adjust for more/less roundness

overline-size = 7
overline-color = ${color.background}
underline-size = 7
underline-color = ${color.background}

border-size = 0
border-color = ${color.background}

padding = 0
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0

; Only tray
modules-left = sep-1
modules-right = sep-2

tray-position = center
tray-detached = false
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 1
tray-maxsize = 20
tray-scale = 1.0
tray-background = ${color.alt-background}



[settings]
; Swallow `throttle-output` events if they happen
; within `throttle-output-for` ms.
throttle-output = 5
throttle-output-for = 10

; Reload upon receiving XCB_RANDR_SCREEN_CHANGE_NOTIFY events
screenchange-reload = false

; Compositing operators
; @see: https://www.cairographics.org/manual/cairo-cairo-t.html#cairo-operator-t
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; Transparency without a compositor
pseudo-transparency = false
