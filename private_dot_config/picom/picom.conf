# Shadows
shadow = true;
shadow-rounded = true;
shadow-opacity = 0.6;
shadow-radius = 15;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'i3-frame'",
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;
# Transparency / Opacity
inactive-opacity = 0.80;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
detect-client-opacity = true;
focus-exclude = [ 
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
];
opacity-rule = [
  "90:class_g = 'URxvt'",
  "97:class_g = 'Anki'",
  "70:class_g = 'kitty' && !focused",
  "85:class_g = 'kitty' && focused",
  "70:class_g = 'i3bar'",
  "70:class_g = 'Code' && !focused",
  "85:class_g = 'Code' && focused",
  "95:class_g = 'firefox'",
  "75:class_g = 'Rofi'",
  "90:class_g = 'Org.gnome.Nautilus'",
  "90:class_g = 'Thunar'",
  "60:class_g = 'Blueman-manager' && !focused"
  # "100:class_g = 'Polybar'"
  # "70:class_g = 'Blueman-manager' && focused",
  # "60:class_g = 'Google-chrome' && !focused",
  # "80:class_g = 'Google-chrome' && focused",
];

# General settings
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
# refresh-rate = 0;
use-ewmh-active-win = true;
detect-transient = true;
detect-client-leader = true;
use-damage = false;
log-level = "warn";
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1; }
  dropdown_menu = { opacity = 1; }
  menu = { shadow = false; blur-background = false;}
};

#################################
#             Corners           #
#################################
corner-radius = 10.0;
# round-borders = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Conky'",
  "class_g = 'Rofi'"
];

animation-stiffness = 300.0;
animation-dampening = 20.0;

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.1;
    scale = 0.9;
},{
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.1;
    scale = 0.9;
},{
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.2;
}
)

blur:
{
	method = "dual_kawase";
	strength = 2;
};